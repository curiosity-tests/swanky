# Swanky GitHub CI

name: Swanky
run-name: "Swanky ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
    branches: [dev]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build-docs:
    name: "Build Swanky documentation"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build documentation
        run: cargo doc --no-deps

      - name: Copy default start page
        run: cp etc/rustdoc-index.html target/doc/index.html

      - name: Upload HTML artifact
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc/

  deploy-docs:
    if: false   # racecar: scan/report job, not a build
    name: "Deploy Swanky documentation"
    needs: [build-docs]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish docs to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
